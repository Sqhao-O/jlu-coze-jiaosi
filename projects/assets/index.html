<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/logo.png">
    <title>教思 AI 教学助手</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-primary: #f8f9fa; --bg-secondary: #ffffff; --bg-sidebar: #1a1a2e;
            --text-primary: #212529; --text-secondary: #495057; --text-muted: #868e96;
            --text-sidebar: #e9ecef; --text-sidebar-muted: #adb5bd;
            --border: #dee2e6; --border-light: #e9ecef;
            --accent: #5b6abf; --accent-hover: #4a579e; --accent-light: #eef0ff;
            --success: #51cf66; --error: #ff6b6b; --warning: #ffd43b;
            --radius: 12px; --radius-sm: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', sans-serif; background: var(--bg-primary); color: var(--text-primary); height: 100vh; display: flex; }

        /* Sidebar */
        .sidebar { width: 280px; background: var(--bg-sidebar); color: var(--text-sidebar); display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; }
        .sidebar-header { padding: 20px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .sidebar-logo img { width: 36px; height: 36px; border-radius: 8px; }
        .sidebar-title { font-size: 18px; font-weight: 700; }
        .sidebar-subtitle { font-size: 11px; color: var(--text-sidebar-muted); margin-top: 2px; }

        .teacher-panel { padding: 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .teacher-panel h3 { font-size: 13px; color: var(--text-sidebar-muted); margin: 0 0 12px 0; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
        .teacher-panel h3 .collapse-arrow { font-size: 10px; transition: transform 0.2s; }
        .teacher-panel.collapsed h3 .collapse-arrow { transform: rotate(-90deg); }
        .teacher-panel-body { overflow: hidden; transition: max-height 0.3s ease, opacity 0.2s ease; max-height: 600px; opacity: 1; }
        .teacher-panel.collapsed .teacher-panel-body { max-height: 0; opacity: 0; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-sidebar-muted); margin-bottom: 4px; }
        .form-row { display: flex; gap: 8px; }
        .form-row .form-group { flex: 1; min-width: 0; }

        /* Combo input: select + custom toggle */
        .combo-input { display: flex; gap: 4px; align-items: center; }
        .combo-input .select-input,
        .combo-input .custom-input { flex: 1; min-width: 0; }
        .combo-input .custom-input { display: none; }
        .combo-input.custom-mode .select-input { display: none; }
        .combo-input.custom-mode .custom-input { display: block; }
        .combo-input select, .combo-input input {
            width: 100%; padding: 7px 10px; border: 1px solid rgba(255,255,255,0.12);
            border-radius: var(--radius-sm); background: rgba(255,255,255,0.06);
            color: var(--text-sidebar); font-size: 13px; outline: none; transition: border-color 0.2s;
        }
        .combo-input select:focus, .combo-input input:focus { border-color: var(--accent); }
        .combo-input select option { background: #2a2a4a; color: #fff; }
        .toggle-btn {
            flex-shrink: 0;
            width: 26px; height: 26px; border: none; border-radius: 4px;
            background: rgba(255,255,255,0.08); color: var(--text-sidebar-muted);
            cursor: pointer; font-size: 11px; line-height: 26px; text-align: center;
            transition: all 0.15s;
        }
        .toggle-btn:hover { background: rgba(255,255,255,0.15); color: var(--text-sidebar); }
        .toggle-btn.active { background: var(--accent); color: #fff; }

        /* Sidebar actions */
        .sidebar-actions { padding: 8px 16px; display: flex; gap: 6px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .sidebar-actions button { flex: 1; padding: 8px; border: 1px dashed rgba(255,255,255,0.2); border-radius: var(--radius-sm); background: transparent; color: var(--text-sidebar-muted); cursor: pointer; font-size: 12px; transition: all 0.2s; }
        .sidebar-actions button:hover { border-color: var(--accent); color: var(--accent); background: rgba(91,106,191,0.1); }
        .sidebar-actions button.danger:hover { border-color: var(--error); color: var(--error); background: rgba(255,107,107,0.1); }

        /* Chat list */
        .chat-list { flex: 1; padding: 4px 8px; overflow-y: auto; }
        .chat-item { display: flex; align-items: center; padding: 8px 10px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; color: var(--text-sidebar-muted); transition: all 0.15s; gap: 8px; }
        .chat-item:hover { background: rgba(255,255,255,0.06); color: var(--text-sidebar); }
        .chat-item.active { background: rgba(91,106,191,0.2); color: var(--text-sidebar); }
        .chat-item .chat-item-text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .chat-item .chat-item-mode { font-size: 10px; flex-shrink: 0; }
        .chat-item .chat-item-delete { flex-shrink: 0; width: 20px; height: 20px; border: none; border-radius: 4px; background: transparent; color: var(--text-sidebar-muted); cursor: pointer; font-size: 11px; display: none; align-items: center; justify-content: center; }
        .chat-item:hover .chat-item-delete { display: flex; }
        .chat-item .chat-item-delete:hover { background: rgba(255,107,107,0.2); color: var(--error); }

        /* Main */
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

        /* Topbar */
        .topbar { padding: 12px 20px; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; justify-content: space-between; background: var(--bg-secondary); }
        .topbar-title { font-size: 15px; font-weight: 600; }
        .topbar-badge { font-size: 11px; padding: 3px 10px; border-radius: 99px; background: var(--accent-light); color: var(--accent); font-weight: 500; }

        /* Mode Selector */
        .mode-selector { padding: 10px 20px; background: var(--bg-secondary); border-bottom: 1px solid var(--border-light); display: flex; gap: 6px; overflow-x: auto; }
        .mode-btn { display: flex; align-items: center; gap: 5px; padding: 6px 14px; border: 1px solid var(--border); border-radius: 99px; background: var(--bg-primary); color: var(--text-secondary); cursor: pointer; font-size: 13px; white-space: nowrap; transition: all 0.15s; }
        .mode-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
        .mode-btn.active { border-color: var(--accent); background: var(--accent); color: #fff; }
        .mode-btn .mode-icon { font-size: 14px; }

        /* Progress */
        .progress-bar { height: 3px; background: var(--border-light); overflow: hidden; }
        .progress-bar .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--success)); transition: width 0.3s; }
        .progress-bar.active .fill { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        /* Messages */
        .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .message { display: flex; }
        .message.user { justify-content: flex-end; }
        .bubble { max-width: 75%; padding: 12px 16px; border-radius: var(--radius); line-height: 1.7; font-size: 14px; word-break: break-word; }
        .message.user .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
        .message.assistant .bubble { background: var(--bg-secondary); border: 1px solid var(--border-light); border-bottom-left-radius: 4px; }
        .message.assistant .bubble h1 { font-size: 20px; margin: 12px 0 8px; padding-bottom: 6px; border-bottom: 2px solid var(--border-light); }
        .message.assistant .bubble h2 { font-size: 16px; margin: 12px 0 6px; color: var(--accent); }
        .message.assistant .bubble h3 { font-size: 14px; margin: 8px 0 4px; }
        .message.assistant .bubble ul, .message.assistant .bubble ol { padding-left: 20px; margin: 4px 0; }
        .message.assistant .bubble li { margin: 2px 0; }
        .message.assistant .bubble strong { color: var(--accent); }
        .message.assistant .bubble blockquote { border-left: 3px solid var(--accent); padding: 4px 12px; margin: 8px 0; background: var(--accent-light); border-radius: 0 6px 6px 0; }
        .message.assistant .bubble hr { border: none; border-top: 1px solid var(--border-light); margin: 12px 0; }
        .message.assistant .bubble code { background: rgba(91,106,191,0.08); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
        .message.assistant .bubble pre { background: #1a1a2e; color: #e9ecef; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 8px 0; }
        .message.assistant .bubble pre code { background: none; padding: 0; color: inherit; }

        .typing-indicator { display: flex; gap: 4px; padding: 4px 0; }
        .typing-indicator span { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: typing 1.4s infinite; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1); } }

        /* Input */
        .input-area { padding: 12px 20px 16px; border-top: 1px solid var(--border-light); background: var(--bg-secondary); }
        .input-row { display: flex; gap: 8px; align-items: flex-end; }
        textarea { flex: 1; padding: 10px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg-primary); color: var(--text-primary); font-size: 14px; resize: none; outline: none; font-family: inherit; transition: border-color 0.2s; line-height: 1.5; max-height: 120px; }
        textarea:focus { border-color: var(--accent); }
        .send-btn { width: 40px; height: 40px; border: none; border-radius: var(--radius-sm); background: var(--accent); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; flex-shrink: 0; }
        .send-btn:hover { background: var(--accent-hover); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .send-btn svg { width: 18px; height: 18px; }

        /* Empty state */
        .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); gap: 12px; }
        .empty-state .icon { display: flex; align-items: center; justify-content: center; gap: 8px; }
        .empty-state .icon img { height: 64px; width: 64px; object-fit: contain; }
        .empty-state .icon .logo-x { font-size: 22px; color: var(--text-muted); font-weight: 300; opacity: 0.5; line-height: 1; }
        .empty-state .hint { font-size: 14px; }
        .empty-state .sub-hint { font-size: 12px; }

        /* Responsive */
        @media (max-width: 768px) { .sidebar { display: none; } }

        /* Knowledge panel */
        .knowledge-panel { padding: 8px 16px 16px; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .knowledge-panel h3 { font-size: 13px; color: var(--text-sidebar-muted); margin: 0 0 12px 0; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; user-select: none; }
        .knowledge-panel h3 .collapse-arrow { font-size: 10px; transition: transform 0.2s; }
        .knowledge-panel.collapsed h3 .collapse-arrow { transform: rotate(-90deg); }
        .knowledge-panel-body { overflow: hidden; transition: max-height 0.3s ease, opacity 0.2s ease; max-height: 600px; opacity: 1; }
        .knowledge-panel.collapsed .knowledge-panel-body { max-height: 0; opacity: 0; }
        .knowledge-panel .form-group label { display: block; font-size: 12px; color: var(--text-sidebar-muted); margin-bottom: 4px; }
        .knowledge-panel select { width: 100%; padding: 7px 10px; border: 1px solid rgba(255,255,255,0.12); border-radius: var(--radius-sm); background: rgba(255,255,255,0.06); color: var(--text-sidebar); font-size: 13px; outline: none; transition: border-color 0.2s; }
        .knowledge-panel select:focus { border-color: var(--accent); }
        .knowledge-panel select option { background: #2a2a4a; color: #fff; }
        .kb-rag-hint { margin-top: 8px; padding: 5px 10px; border-radius: 6px; background: rgba(81,207,102,0.12); color: var(--success); font-size: 12px; display: none; align-items: center; gap: 5px; }
        .kb-rag-hint.visible { display: flex; }
        .kb-actions { display: flex; gap: 8px; margin-top: 8px; }
        .kb-btn { padding: 4px 10px; font-size: 12px; border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; background: rgba(255,255,255,0.06); color: var(--text-sidebar-muted); cursor: pointer; transition: all 0.15s; }
        .kb-btn:hover { background: rgba(255,255,255,0.12); color: var(--text-sidebar); }
        .kb-btn.danger { color: #fc8181; border-color: rgba(252,129,129,0.2); }
        .kb-btn.danger:hover { background: rgba(255,107,107,0.12); color: #fc8181; }
        .kb-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .kb-docs { margin-top: 8px; }
        .kb-docs-toggle { display: flex; align-items: center; justify-content: space-between; padding: 5px 10px; border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; background: rgba(255,255,255,0.06); color: var(--text-sidebar); font-size: 12px; cursor: pointer; user-select: none; transition: background 0.15s; }
        .kb-docs-toggle:hover { background: rgba(255,255,255,0.1); }
        .kb-docs-toggle .toggle-arrow { transition: transform 0.2s; font-size: 10px; }
        .kb-docs-toggle.open .toggle-arrow { transform: rotate(90deg); }
        .kb-docs-body { max-height: 0; overflow: hidden; margin-top: 4px; padding: 0 0; transition: max-height 0.3s ease, padding 0.3s ease; }
        .kb-docs-body.open { max-height: 500px; padding: 4px 0; }
        .kb-doc-item { display: flex; align-items: center; padding: 4px 8px; font-size: 12px; border-radius: 4px; margin-bottom: 1px; color: var(--text-sidebar); }
        .kb-doc-item:hover { background: rgba(255,255,255,0.06); }
        .kb-doc-item .doc-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .kb-doc-item .doc-info { color: var(--text-sidebar-muted); font-size: 11px; margin-left: 6px; flex-shrink: 0; }
        .kb-doc-item .doc-del { cursor: pointer; color: #fc8181; margin-left: 6px; font-size: 11px; flex-shrink: 0; opacity: 0; transition: opacity 0.15s; }
        .kb-doc-item:hover .doc-del { opacity: 1; }
        .kb-doc-empty { font-size: 12px; color: var(--text-sidebar-muted); padding: 4px 8px; }
        .kb-docs-actions { display: flex; gap: 6px; margin-top: 6px; }
        .kb-docs-actions .kb-btn { flex: 1; padding: 5px 8px; font-size: 11px; }
        .kb-upload-status { font-size: 11px; color: var(--text-sidebar); margin-top: 4px; opacity: 0.8; }
        /* Create KB dialog */
        .kb-dialog-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .kb-dialog { background: #2a2a4a; color: var(--text-sidebar); border-radius: 12px; padding: 20px; width: 320px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .kb-dialog h4 { margin: 0 0 12px 0; font-size: 16px; color: #fff; }
        .kb-dialog input { width: 100%; padding: 8px 10px; border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; font-size: 14px; box-sizing: border-box; background: rgba(255,255,255,0.06); color: var(--text-sidebar); outline: none; }
        .kb-dialog input:focus { border-color: var(--accent); }
        .kb-dialog textarea { width: 100%; padding: 8px 10px; border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; font-size: 13px; box-sizing: border-box; resize: vertical; min-height: 60px; background: rgba(255,255,255,0.06); color: var(--text-sidebar); outline: none; }
        .kb-dialog textarea:focus { border-color: var(--accent); }
        .kb-dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
        .kb-dialog-actions button { padding: 6px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; }
        .kb-dialog-actions .cancel-btn { background: rgba(255,255,255,0.08); color: var(--text-sidebar-muted); }
        .kb-dialog-actions .cancel-btn:hover { background: rgba(255,255,255,0.15); color: var(--text-sidebar); }
        .kb-dialog-actions .confirm-btn { background: var(--accent); color: white; }
    </style>
</head>
<body>

<!-- ========== Sidebar ========== -->
<div class="sidebar">
    <div class="sidebar-header">
        <div class="sidebar-logo"><img src="/assets/logo.png" alt="教思"></div>
        <div>
            <div class="sidebar-title">教思</div>
            <div class="sidebar-subtitle">AI 教学助手</div>
        </div>
    </div>

    <!-- 教师信息面板 -->
    <div class="teacher-panel">
        <h3 onclick="toggleTeacherPanel()">备课参数 <span class="collapse-arrow">▼</span></h3>
        <div class="teacher-panel-body">
        <div class="form-group">
            <label>学科</label>
            <div class="combo-input" id="combo-subject">
                <div class="select-input"><select id="teacherSubject"><option value="">选择学科</option></select></div>
                <div class="custom-input"><input type="text" id="teacherSubjectCustom" placeholder="输入自定义学科"></div>
                <button class="toggle-btn" onclick="toggleCombo('subject')" title="切换自定义输入">✏</button>
            </div>
        </div>
        <div class="form-group">
            <label>年级</label>
            <div class="combo-input" id="combo-grade">
                <div class="select-input"><select id="teacherGrade"><option value="">选择年级</option></select></div>
                <div class="custom-input"><input type="text" id="teacherGradeCustom" placeholder="输入自定义年级"></div>
                <button class="toggle-btn" onclick="toggleCombo('grade')" title="切换自定义输入">✏</button>
            </div>
        </div>
        <div class="form-group">
            <label>教学目标</label>
            <div class="combo-input" id="combo-objectives">
                <div class="select-input"><select id="teacherObjectives"><option value="">选择教学目标</option></select></div>
                <div class="custom-input"><input type="text" id="teacherObjectivesCustom" placeholder="输入自定义教学目标"></div>
                <button class="toggle-btn" onclick="toggleCombo('objectives')" title="切换自定义输入">✏</button>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>重点</label>
                <div class="combo-input" id="combo-keypoints">
                    <div class="select-input"><select id="teacherKeyPoints"><option value="">选择重点</option></select></div>
                    <div class="custom-input"><input type="text" id="teacherKeyPointsCustom" placeholder="自定义重点"></div>
                    <button class="toggle-btn" onclick="toggleCombo('keypoints')" title="切换自定义输入">✏</button>
                </div>
            </div>
            <div class="form-group">
                <label>难点</label>
                <div class="combo-input" id="combo-difficulties">
                    <div class="select-input"><select id="teacherDifficulties"><option value="">选择难点</option></select></div>
                    <div class="custom-input"><input type="text" id="teacherDifficultiesCustom" placeholder="自定义难点"></div>
                    <button class="toggle-btn" onclick="toggleCombo('difficulties')" title="切换自定义输入">✏</button>
                </div>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>课时时长</label>
                <div class="combo-input" id="combo-duration">
                    <div class="select-input"><select id="teacherDuration"><option value="">选择时长</option></select></div>
                    <div class="custom-input"><input type="number" id="teacherDurationCustom" placeholder="分钟" min="1" max="180"></div>
                    <button class="toggle-btn" onclick="toggleCombo('duration')" title="切换自定义输入">✏</button>
                </div>
            </div>
            <div class="form-group">
                <label>教学风格</label>
                <div class="combo-input" id="combo-style">
                    <div class="select-input"><select id="teacherStyle"><option value="">选择风格</option></select></div>
                    <div class="custom-input"><input type="text" id="teacherStyleCustom" placeholder="自定义风格"></div>
                    <button class="toggle-btn" onclick="toggleCombo('style')" title="切换自定义输入">✏</button>
                </div>
            </div>
        </div>
        </div>
    </div>

    <!-- 知识库面板 -->
    <div class="knowledge-panel" id="knowledgePanel" style="display:block;">
        <h3 onclick="toggleKBPanel()">知识库 <span class="collapse-arrow">▼</span></h3>
        <div class="knowledge-panel-body">
            <div class="form-group">
                <label>当前知识库</label>
                <select id="kbSelect" onchange="onKBSelect()"><option value="">选择知识库</option></select>
            </div>
            <div class="kb-rag-hint" id="kbRagHint">✓ 已启用知识库增强</div>
            <div class="kb-actions">
                <button class="kb-btn" onclick="showCreateKBDlg()">+ 新建</button>
                <button class="kb-btn danger" onclick="deleteCurrentKB()" id="deleteKBBtn" disabled>🗑 删除</button>
            </div>
            <div class="kb-docs" id="kbDocs" style="display:none;">
                <div class="kb-docs-toggle" id="kbDocsToggle" onclick="toggleKBDocs()">
                    <span id="kbDocsToggleLabel">文档列表 (0)</span>
                    <span class="toggle-arrow">▶</span>
                </div>
                <div class="kb-docs-body" id="kbDocsBody">
                    <div id="kbDocList"></div>
                </div>
                <div class="kb-docs-actions">
                    <button class="kb-btn" onclick="triggerUpload()">📤 上传文档</button>
                </div>
                <input type="file" id="kbFileInput" style="display:none;" accept=".pdf,.docx,.xlsx,.pptx,.txt,.md" onchange="uploadFile(event)">
            </div>
        </div>
    </div>

    <div class="sidebar-actions">
        <button onclick="newChat()">+ 新建对话</button>
        <button class="danger" onclick="clearAllHistory()" title="清除全部历史记录">🗑 清除全部</button>
    </div>
    <div class="chat-list" id="chatList"></div>
</div>

<!-- ========== Main ========== -->
<div class="main">
    <div class="topbar">
        <span class="topbar-title" id="topbarTitle">教思 AI 教学助手</span>
        <span class="topbar-badge" id="statusBadge">就绪</span>
    </div>

    <!-- 功能选择器 -->
    <div class="mode-selector" id="modeSelector">
        <!-- 由 JS 动态生成 -->
    </div>

    <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>

    <div class="messages" id="messagesArea">
        <div class="empty-state" id="emptyState">
            <div class="icon"><img src="/assets/jlu-logo.png" alt="吉林大学" /><span class="logo-x">×</span><img src="/assets/volcengine-logo.png" alt="火山引擎" /></div>
            <div class="hint">选择功能模式，设置备课参数，输入课题即可开始</div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-row">
            <textarea id="userInput" placeholder="输入课题或问题，如：二次函数" rows="1" onkeydown="handleKeydown(event)"></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            </button>
        </div>
    </div>
</div>

<script>
// ========== 常量 ==========
const CHAT_STORAGE_KEY = 'jiaosi_chat_history';
const TEACHER_CONFIG_KEY = 'jiaosi_teacher_config';
const MODE_CONFIG_KEY = 'jiaosi_mode';

// ========== 状态 ==========
let isStreaming = false;
let configLoaded = false;
let currentMode = 'lesson_prep';

// 当前活跃会话
let activeSessionId = null;

// 功能模式定义（从 API 加载后更新）
let MODES = [
    { id: 'lesson_prep', name: '教案生成', icon: '📋', desc: '生成完整结构化教案' },
    { id: 'classroom_sim', name: '课堂预演', icon: '🎭', desc: '预判课堂意外情境与应对' },
    { id: 'blind_spot', name: '盲区检测', icon: '🔍', desc: '发现教案中的逻辑漏洞' },
    { id: 'student_sim', name: '学情推演', icon: '👥', desc: '模拟不同学生的思维路径' },
    { id: 'interaction_design', name: '互动设计', icon: '💬', desc: '设计师生互动方案和话术' },
    { id: 'exam_gen', name: '智能命题', icon: '📝', desc: '一键生成结构化试题' },
    { id: 'ppt_gen', name: 'PPT大纲', icon: '📊', desc: '一键生成PPT课件大纲' },
    { id: 'chat', name: '自由对话', icon: '🗨️', desc: '闲聊或提问' },
];

// ========== 聊天记录存储 ==========
function getAllSessions() {
    try { return JSON.parse(localStorage.getItem(CHAT_STORAGE_KEY) || '{}'); }
    catch (e) { return {}; }
}

function saveAllSessions(sessions) {
    try { localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(sessions)); }
    catch (e) { console.warn('保存聊天记录失败', e); }
}

function getSession(sessionId) {
    return getAllSessions()[sessionId] || null;
}

function saveSession(sessionId, data) {
    const sessions = getAllSessions();
    sessions[sessionId] = data;
    saveAllSessions(sessions);
}

function deleteSession(sessionId) {
    const sessions = getAllSessions();
    delete sessions[sessionId];
    saveAllSessions(sessions);
}

function clearAllSessions() {
    localStorage.removeItem(CHAT_STORAGE_KEY);
}

function createSessionData(mode, firstMsg) {
    return {
        id: 'sess-' + Date.now(),
        title: firstMsg ? firstMsg.slice(0, 30) : '新对话',
        mode: mode,
        messages: [],  // [{role, content}]
        createdAt: Date.now(),
        updatedAt: Date.now(),
    };
}

// ========== 初始化 ==========
document.addEventListener('DOMContentLoaded', async () => {
    await loadTeacherConfig();
    loadSavedTeacherInfo();
    loadSavedMode();
    renderModeSelector();
    setupTextareaAutoResize();
    loadKBList(); // 加载知识库列表

    // 恢复或创建会话
    const sessions = getAllSessions();
    const sessionIds = Object.keys(sessions).sort((a, b) => sessions[b].updatedAt - sessions[a].updatedAt);
    if (sessionIds.length > 0) {
        switchToSession(sessionIds[0]);
    } else {
        newChat();
    }
    renderChatList();
});

// ========== 教师配置加载 ==========
async function loadTeacherConfig() {
    if (configLoaded) return;
    try {
        const resp = await fetch('/api/teacher-config');
        if (resp.ok) {
            const config = await resp.json();
            fillSelect('teacherSubject', config.subjects);
            fillSelect('teacherGrade', config.grades);
            fillSelect('teacherObjectives', config.objectives);
            fillSelect('teacherKeyPoints', config.key_points);
            fillSelect('teacherDifficulties', config.difficult_points);
            fillSelect('teacherDuration', config.durations);
            fillSelect('teacherStyle', config.styles);
            if (config.modes) MODES = config.modes;
            configLoaded = true;
        }
    } catch (e) {
        console.warn('Failed to load teacher config, using defaults');
        fillSelect('teacherSubject', ['语文','数学','英语','物理','化学','生物','历史','地理','政治']);
        fillSelect('teacherGrade', ['一年级','二年级','三年级','四年级','五年级','六年级','初一','初二','初三','高一','高二','高三']);
        fillSelect('teacherObjectives', ['知识与技能','过程与方法','情感态度与价值观','核心素养导向','综合能力培养']);
        fillSelect('teacherKeyPoints', ['概念理解','公式推导','方法掌握','技能训练','思维培养','知识应用']);
        fillSelect('teacherDifficulties', ['抽象概念理解','复杂计算','逻辑推理','知识迁移','综合应用','创新思维']);
        fillSelect('teacherDuration', [20, 30, 40, 45, 60, 90]);
        fillSelect('teacherStyle', ['启发式互动型','系统讲授型','情感体验型','任务驱动型','混合型']);
        configLoaded = true;
    }
}

function fillSelect(id, options) {
    const sel = document.getElementById(id);
    const firstOpt = sel.querySelector('option');
    sel.innerHTML = '';
    if (firstOpt) sel.appendChild(firstOpt);
    options.forEach(opt => {
        const o = document.createElement('option');
        o.value = opt; o.textContent = opt;
        sel.appendChild(o);
    });
}

// ========== 功能选择器 ==========
function renderModeSelector() {
    const container = document.getElementById('modeSelector');
    container.innerHTML = '';
    MODES.forEach(mode => {
        const btn = document.createElement('button');
        btn.className = 'mode-btn' + (mode.id === currentMode ? ' active' : '');
        btn.dataset.mode = mode.id;
        btn.title = mode.desc;
        btn.innerHTML = `<span class="mode-icon">${mode.icon}</span>${mode.name}`;
        btn.onclick = () => selectMode(mode.id);
        container.appendChild(btn);
    });
    updateInputPlaceholder();
}

function selectMode(modeId) {
    currentMode = modeId;
    localStorage.setItem(MODE_CONFIG_KEY, modeId);
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.mode === modeId);
    });
    updateInputPlaceholder();
    // 知识库面板：始终显示（RAG 通用增强，所有模式均可使用）
}

function loadSavedMode() {
    const saved = localStorage.getItem(MODE_CONFIG_KEY);
    if (saved && MODES.find(m => m.id === saved)) {
        currentMode = saved;
    }
}

function updateInputPlaceholder() {
    const input = document.getElementById('userInput');
    const subject = getComboValue('subject');
    if (currentMode === 'chat') {
        input.placeholder = '输入你想聊的话题...';
    } else {
        const modeInfo = MODES.find(m => m.id === currentMode);
        const action = modeInfo ? modeInfo.desc : '开始';
        if (subject) {
            input.placeholder = `输入${subject}课题，如：${getSubjectExample(subject)}`;
        } else {
            input.placeholder = `输入课题开始${action}`;
        }
    }
}

// ========== 组合输入 ==========
function toggleCombo(name) {
    const combo = document.getElementById('combo-' + name);
    const btn = combo.querySelector('.toggle-btn');
    const isCustom = combo.classList.toggle('custom-mode');
    btn.classList.toggle('active', isCustom);
    if (!isCustom) {
        const customInput = combo.querySelector('.custom-input input');
        if (customInput) customInput.value = '';
    }
    updateInputPlaceholder();
}

function getComboValue(name) {
    const combo = document.getElementById('combo-' + name);
    if (combo.classList.contains('custom-mode')) {
        const input = combo.querySelector('.custom-input input');
        return input ? input.value.trim() : '';
    } else {
        const sel = combo.querySelector('.select-input select');
        return sel ? sel.value : '';
    }
}

function setComboValue(name, value) {
    const combo = document.getElementById('combo-' + name);
    const sel = combo.querySelector('.select-input select');
    const customInput = combo.querySelector('.custom-input input');
    if (!value) return;
    if (sel) {
        const opt = Array.from(sel.options).find(o => o.value === value);
        if (opt) {
            sel.value = value;
            return;
        }
    }
    combo.classList.add('custom-mode');
    combo.querySelector('.toggle-btn').classList.add('active');
    if (customInput) customInput.value = value;
}

function loadSavedTeacherInfo() {
    try {
        const saved = JSON.parse(localStorage.getItem(TEACHER_CONFIG_KEY) || '{}');
        if (saved.lesson_subject) setComboValue('subject', saved.lesson_subject);
        if (saved.lesson_grade) setComboValue('grade', saved.lesson_grade);
        if (saved.lesson_objectives) setComboValue('objectives', saved.lesson_objectives);
        if (saved.key_points) setComboValue('keypoints', saved.key_points);
        if (saved.difficult_points) setComboValue('difficulties', saved.difficult_points);
        if (saved.lesson_duration) setComboValue('duration', String(saved.lesson_duration));
        if (saved.style_preference) setComboValue('style', saved.style_preference);
    } catch (e) {}
}

function saveTeacherInfo() {
    const info = getTeacherInfo();
    localStorage.setItem(TEACHER_CONFIG_KEY, JSON.stringify(info));
}

function getTeacherInfo() {
    return {
        lesson_subject: getComboValue('subject'),
        lesson_grade: getComboValue('grade'),
        lesson_objectives: getComboValue('objectives'),
        key_points: getComboValue('keypoints'),
        difficult_points: getComboValue('difficulties'),
        lesson_duration: parseInt(getComboValue('duration')) || 0,
        style_preference: getComboValue('style'),
    };
}

function setupTextareaAutoResize() {
    const ta = document.getElementById('userInput');
    ta.addEventListener('input', () => {
        ta.style.height = 'auto';
        ta.style.height = Math.min(ta.scrollHeight, 120) + 'px';
    });
}

// ========== 会话管理 ==========
function newChat() {
    // 保存当前会话
    flushCurrentSession();

    activeSessionId = 'sess-' + Date.now();
    const sessionData = createSessionData(currentMode);
    sessionData.id = activeSessionId;
    saveSession(activeSessionId, sessionData);

    // 清空消息区域
    clearMessagesArea();
    setProgress(0);
    setStatus('就绪');
    renderChatList();
}

function switchToSession(sessionId) {
    if (isStreaming) return;
    // 保存当前会话
    flushCurrentSession();

    activeSessionId = sessionId;
    const session = getSession(sessionId);
    if (!session) {
        newChat();
        return;
    }

    // 恢复模式
    if (session.mode && MODES.find(m => m.id === session.mode)) {
        currentMode = session.mode;
        localStorage.setItem(MODE_CONFIG_KEY, currentMode);
        renderModeSelector();
    }

    // 恢复消息
    restoreMessages(session.messages || []);
    setProgress(0);
    setStatus('就绪');
    renderChatList();
}

function flushCurrentSession() {
    if (!activeSessionId) return;
    // 从 DOM 读取当前消息并保存（仅同步，不修改 updatedAt，避免切换会话时列表跳动）
    const messages = collectMessagesFromDOM();
    const session = getSession(activeSessionId);
    if (session) {
        session.messages = messages;
        if (messages.length > 0) {
            const firstUser = messages.find(m => m.role === 'user');
            session.title = firstUser ? firstUser.content.slice(0, 30) : '新对话';
        }
        saveSession(activeSessionId, session);
    }
}

function collectMessagesFromDOM() {
    const area = document.getElementById('messagesArea');
    const msgEls = area.querySelectorAll('.message');
    const messages = [];
    msgEls.forEach(el => {
        const role = el.classList.contains('user') ? 'user' : 'assistant';
        const bubble = el.querySelector('.bubble');
        if (!bubble) return;
        // 用户消息直接取文本
        if (role === 'user') {
            messages.push({ role, content: bubble.textContent });
        } else {
            // 助手消息取 Markdown 原文（存在 data-raw 属性）
            const raw = bubble.getAttribute('data-raw') || bubble.textContent;
            messages.push({ role, content: raw });
        }
    });
    return messages;
}

function clearMessagesArea() {
    document.getElementById('messagesArea').innerHTML = `<div class="empty-state" id="emptyState">
        <div class="icon"><img src="/assets/jlu-logo.png" alt="吉林大学" /><span class="logo-x">×</span><img src="/assets/volcengine-logo.png" alt="火山引擎" /></div>
        <div class="hint">选择功能模式，设置备课参数，输入课题即可开始</div>
    </div>`;
}

function restoreMessages(messages) {
    clearMessagesArea();
    const area = document.getElementById('messagesArea');
    const empty = document.getElementById('emptyState');
    if (messages.length > 0 && empty) empty.style.display = 'none';

    messages.forEach(msg => {
        const el = document.createElement('div');
        el.className = `message ${msg.role}`;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        if (msg.role === 'assistant') {
            bubble.innerHTML = renderMarkdown(msg.content);
            bubble.setAttribute('data-raw', msg.content);
        } else {
            bubble.textContent = msg.content;
        }
        el.appendChild(bubble);
        area.appendChild(el);
    });
    area.scrollTop = area.scrollHeight;
}

function deleteChatSession(sessionId, e) {
    e.stopPropagation();
    deleteSession(sessionId);
    if (activeSessionId === sessionId) {
        const sessions = getAllSessions();
        const ids = Object.keys(sessions).sort((a, b) => sessions[b].updatedAt - sessions[a].updatedAt);
        if (ids.length > 0) {
            switchToSession(ids[0]);
        } else {
            newChat();
        }
    }
    renderChatList();
}

function clearAllHistory() {
    if (!confirm('确定要清除全部聊天记录吗？此操作不可撤销。')) return;
    clearAllSessions();
    activeSessionId = null;
    newChat();
    renderChatList();
}

// ========== 会话列表渲染 ==========
function renderChatList() {
    const list = document.getElementById('chatList');
    const sessions = getAllSessions();
    const ids = Object.keys(sessions).sort((a, b) => sessions[b].updatedAt - sessions[a].updatedAt);

    if (ids.length === 0) {
        list.innerHTML = '<div style="padding:16px;color:var(--text-sidebar-muted);font-size:12px;text-align:center;">暂无对话记录</div>';
        return;
    }

    list.innerHTML = '';
    ids.forEach(sid => {
        const s = sessions[sid];
        const item = document.createElement('div');
        item.className = 'chat-item' + (sid === activeSessionId ? ' active' : '');
        item.onclick = () => switchToSession(sid);

        const modeInfo = MODES.find(m => m.id === s.mode);
        const modeLabel = modeInfo ? modeInfo.icon : '📝';

        item.innerHTML = `<span class="chat-item-mode">${modeLabel}</span>
            <span class="chat-item-text">${escapeHtml(s.title || '新对话')}</span>
            <button class="chat-item-delete" onclick="deleteChatSession('${sid}', event)" title="删除此对话">×</button>`;
        list.appendChild(item);
    });
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// ========== 消息 ==========
function addMessage(role, content) {
    const area = document.getElementById('messagesArea');
    const empty = document.getElementById('emptyState');
    if (empty) empty.style.display = 'none';

    const msg = document.createElement('div');
    msg.className = `message ${role}`;

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if (role === 'assistant') {
        bubble.innerHTML = renderMarkdown(content);
        bubble.setAttribute('data-raw', content);
    } else {
        bubble.textContent = content;
    }

    msg.appendChild(bubble);
    area.appendChild(msg);
    area.scrollTop = area.scrollHeight;
    return bubble;
}

function createStreamingMessage() {
    const area = document.getElementById('messagesArea');
    const empty = document.getElementById('emptyState');
    if (empty) empty.style.display = 'none';

    const msg = document.createElement('div');
    msg.className = 'message assistant';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';

    msg.appendChild(bubble);
    area.appendChild(msg);
    area.scrollTop = area.scrollHeight;
    return bubble;
}

function renderMarkdown(text) {
    if (!text) return '';
    try {
        return marked.parse(text);
    } catch (e) {
        return text.replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
    }
}

// ========== 进度 ==========
function setProgress(percent, active = false) {
    const bar = document.getElementById('progressBar');
    const fill = document.getElementById('progressFill');
    fill.style.width = percent + '%';
    bar.classList.toggle('active', active);
}

function setStatus(text) {
    document.getElementById('statusBadge').textContent = text;
}

// ========== 知识库管理 ==========
let currentKBId = '';
let kbListCache = [];

async function _apiFetch(url, options = {}) {
    const resp = await fetch(url, options);
    const text = await resp.text();
    let data;
    try { data = JSON.parse(text); } catch { throw new Error(text || `HTTP ${resp.status}`); }
    if (!resp.ok) throw new Error(data.detail || data.message || `HTTP ${resp.status}`);
    return data;
}

async function loadKBList() {
    try {
        kbListCache = await _apiFetch('/api/knowledge-bases');
        const sel = document.getElementById('kbSelect');
        sel.innerHTML = '<option value="">选择知识库</option>';
        kbListCache.forEach(kb => {
            const opt = document.createElement('option');
            opt.value = kb.id;
            opt.textContent = `${kb.name}（${kb.doc_count}篇文档）`;
            sel.appendChild(opt);
        });
        if (currentKBId) sel.value = currentKBId;
        document.getElementById('deleteKBBtn').disabled = !currentKBId;
        updateRAGHint();
    } catch (e) {
        console.error('加载知识库列表失败', e);
    }
}

function onKBSelect() {
    const sel = document.getElementById('kbSelect');
    currentKBId = sel.value;
    document.getElementById('deleteKBBtn').disabled = !currentKBId;
    updateRAGHint();
    if (currentKBId) {
        loadKBDocs(currentKBId);
    } else {
        document.getElementById('kbDocs').style.display = 'none';
    }
}

function updateRAGHint() {
    const hint = document.getElementById('kbRagHint');
    if (currentKBId) {
        hint.classList.add('visible');
    } else {
        hint.classList.remove('visible');
    }
}

function toggleKBPanel() {
    document.getElementById('knowledgePanel').classList.toggle('collapsed');
}

function toggleTeacherPanel() {
    document.querySelector('.teacher-panel').classList.toggle('collapsed');
}

function toggleKBDocs() {
    const toggle = document.getElementById('kbDocsToggle');
    const body = document.getElementById('kbDocsBody');
    toggle.classList.toggle('open');
    body.classList.toggle('open');
}

async function loadKBDocs(kbId) {
    try {
        const docs = await _apiFetch(`/api/knowledge-bases/${kbId}/documents`);
        const docsSection = document.getElementById('kbDocs');
        const docList = document.getElementById('kbDocList');
        const toggleLabel = document.getElementById('kbDocsToggleLabel');
        
        docsSection.style.display = 'block';
        toggleLabel.textContent = `文档列表 (${docs.length})`;
        
        if (!docs.length) {
            docList.innerHTML = '<div class="kb-doc-empty">暂无文档</div>';
        } else {
            docList.innerHTML = docs.map(d => {
                const statusIcon = d.status === 'ready' ? '✓' : '⏳';
                return `<div class="kb-doc-item">
                    <span class="doc-name" title="${d.filename}">📄 ${d.filename}</span>
                    <span class="doc-info">${d.chunk_count}块 ${statusIcon}</span>
                    <span class="doc-del" onclick="deleteDoc('${kbId}','${d.id}')" title="删除">✕</span>
                </div>`;
            }).join('');
        }
    } catch (e) {
        console.error('加载文档列表失败', e);
    }
}

function showCreateKBDlg() {
    const overlay = document.createElement('div');
    overlay.className = 'kb-dialog-overlay';
    overlay.id = 'createKBDlg';
    overlay.innerHTML = `
        <div class="kb-dialog">
            <h4>新建知识库</h4>
            <input id="newKBName" placeholder="知识库名称，如：人教版九年级数学" />
            <textarea id="newKBDesc" placeholder="描述（可选）" style="margin-top:8px;"></textarea>
            <div class="kb-dialog-actions">
                <button class="cancel-btn" onclick="document.getElementById('createKBDlg').remove()">取消</button>
                <button class="confirm-btn" onclick="createKB()">创建</button>
            </div>
        </div>
    `;
    document.body.appendChild(overlay);
    document.getElementById('newKBName').focus();
}

async function createKB() {
    const name = document.getElementById('newKBName').value.trim();
    if (!name) { alert('请输入知识库名称'); return; }
    const desc = document.getElementById('newKBDesc').value.trim();
    try {
        const form = new FormData();
        form.append('name', name);
        form.append('description', desc);
        const kb = await _apiFetch('/api/knowledge-bases', { method: 'POST', body: form });
        currentKBId = kb.id;
        await loadKBList();
        onKBSelect();
        document.getElementById('createKBDlg').remove();
    } catch (e) {
        alert('创建失败: ' + e.message);
    }
}

async function deleteCurrentKB() {
    if (!currentKBId) return;
    if (!confirm('确定删除当前知识库及其所有文档？')) return;
    try {
        await _apiFetch(`/api/knowledge-bases/${currentKBId}`, { method: 'DELETE' });
        currentKBId = '';
        await loadKBList();
        document.getElementById('kbDocs').style.display = 'none';
        updateRAGHint();
    } catch (e) {
        alert('删除失败: ' + e.message);
    }
}

function triggerUpload() {
    document.getElementById('kbFileInput').click();
}

async function uploadFile(event) {
    const file = event.target.files[0];
    if (!file || !currentKBId) return;
    const statusEl = document.createElement('div');
    statusEl.className = 'kb-upload-status';
    statusEl.textContent = `⏳ 上传中: ${file.name}...`;
    const docsSection = document.getElementById('kbDocs');
    docsSection.appendChild(statusEl);
    try {
        const form = new FormData();
        form.append('file', file);
        const result = await _apiFetch(`/api/knowledge-bases/${currentKBId}/upload`, { method: 'POST', body: form });
        statusEl.textContent = `✅ ${file.name} → ${result.chunk_count} 块`;
        await loadKBDocs(currentKBId);
        await loadKBList();
    } catch (e) {
        statusEl.textContent = `❌ 上传失败: ${e.message}`;
    }
    // 清空 input 以允许重复上传同文件
    event.target.value = '';
    setTimeout(() => statusEl.remove(), 5000);
}

async function deleteDoc(kbId, docId) {
    if (!confirm('确定删除此文档？')) return;
    try {
        await _apiFetch(`/api/knowledge-bases/${kbId}/documents/${docId}`, { method: 'DELETE' });
        await loadKBDocs(kbId);
        await loadKBList();
    } catch (e) {
        alert('删除失败: ' + e.message);
    }
}

// ========== 发送消息 ==========
async function sendMessage() {
    if (isStreaming) return;

    const input = document.getElementById('userInput');
    const text = input.value.trim();
    if (!text) return;

    saveTeacherInfo();

    // 保存用户消息到会话
    addMessage('user', text);
    appendToSession('user', text);

    input.value = '';
    input.style.height = 'auto';

    // 构建历史 messages（上下文联动）
    const session = getSession(activeSessionId);
    const historyMessages = (session ? session.messages : []).map(m => ({
        role: m.role,
        content: m.content,
    }));

    const teacherInfo = getTeacherInfo();

    isStreaming = true;
    document.getElementById('sendBtn').disabled = true;

    const modeInfo = MODES.find(m => m.id === currentMode);
    setStatus(modeInfo ? `${modeInfo.name}中...` : '生成中...');
    setProgress(5, true);

    const bubble = createStreamingMessage();
    let fullText = '';

    try {
        await sendStreamRequest(historyMessages, teacherInfo, currentMode, bubble, (chunk) => {
            fullText += chunk;
            bubble.innerHTML = renderMarkdown(fullText);
            bubble.setAttribute('data-raw', fullText);
            document.getElementById('messagesArea').scrollTop = document.getElementById('messagesArea').scrollHeight;
        });

        // 保存助手回复到会话
        appendToSession('assistant', fullText);
    } catch (e) {
        console.error('Request error:', e);
        bubble.innerHTML = `<span style="color:var(--error)">请求出错: ${e.message}</span>`;
    } finally {
        isStreaming = false;
        document.getElementById('sendBtn').disabled = false;
        setStatus('就绪');
        setProgress(100, false);
        setTimeout(() => setProgress(0), 1000);
    }
}

function appendToSession(role, content) {
    if (!activeSessionId) return;
    const session = getSession(activeSessionId);
    if (!session) return;
    session.messages.push({ role, content });
    session.updatedAt = Date.now();
    // 更新标题（取第一条用户消息）
    if (role === 'user' && session.messages.filter(m => m.role === 'user').length === 1) {
        session.title = content.slice(0, 30);
    }
    saveSession(activeSessionId, session);
    renderChatList();
}

async function sendStreamRequest(historyMessages, teacherInfo, mode, bubble, onChunk) {
    const payload = {
        model: 'vibe-coding',
        messages: historyMessages,
        stream: true,
        session_id: activeSessionId,
        extra_body: {
            ...teacherInfo,
            mode: mode,
            ...(currentKBId ? { knowledge_base_id: currentKBId } : {}),
        }
    };

    const resp = await fetch('/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
    });

    if (!resp.ok) {
        throw new Error(`HTTP ${resp.status}`);
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let progressPercent = 10;

    while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';

        for (const line of lines) {
            if (line.startsWith('event: node_progress')) {
                continue;
            }
            if (line.startsWith('data: ') && line.length > 6) {
                const dataStr = line.slice(6);

                // 节点进度事件
                try {
                    const evt = JSON.parse(dataStr);
                    if (evt.node && evt.status) {
                        if (evt.progress_id === 'intent') progressPercent = 15;
                        else if (evt.progress_id === 'generating') progressPercent = 40;
                        else if (evt.progress_id === 'formatting') progressPercent = 85;
                        setProgress(progressPercent, true);
                        continue;
                    }
                } catch (e) {}

                // OpenAI 格式的 chunk
                try {
                    const chunk = JSON.parse(dataStr);
                    if (chunk.choices && chunk.choices[0]) {
                        const delta = chunk.choices[0].delta;
                        if (delta && delta.content) {
                            onChunk(delta.content);
                        }
                    }
                } catch (e) {
                    if (dataStr.trim() === '[DONE]') break;
                }
            }
        }
    }
}

function handleKeydown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}

function getSubjectExample(subject) {
    const examples = {
        '语文': '荷塘月色', '数学': '二次函数', '英语': '现在完成时',
        '物理': '牛顿第二定律', '化学': '氧化还原反应', '生物': '细胞结构',
        '历史': '文艺复兴', '地理': '气候类型', '政治': '市场经济',
    };
    return examples[subject] || '课题名称';
}
